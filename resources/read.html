<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- Books are opened from blob: addresses, so scripts inside a book would run
     as this site. This policy lets only the site's own scripts run. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' blob:; frame-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="theme-color" content="#fbf8f2">
<title>Reader · Gentle King</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="reader/reader.css">
<script src="reader/boot.js"></script>
<script type="module" src="reader/reader.js"></script>
</head>
<body>
<a class="skip" href="#stage">Skip to the book</a>

<header class="bar bar-top">
  <a class="back" href="../resources.html#library" aria-label="Back to the library">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    <span>Library</span>
  </a>
  <div class="book-id">
    <p class="book-title" id="book-title">Opening the book</p>
    <p class="book-author" id="book-author"></p>
  </div>
  <div class="tools">
    <button class="tool" id="btn-toc" type="button" aria-label="Contents" aria-controls="toc-panel" aria-expanded="false" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h11"/></svg>
    </button>
    <button class="tool" id="btn-search" type="button" aria-label="Search in this book" aria-controls="search-panel" aria-expanded="false" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
    <button class="tool" id="btn-settings" type="button" aria-label="Reading settings" aria-controls="settings-panel" aria-expanded="false">
      <span class="aa" aria-hidden="true">Aa</span>
    </button>
    <a class="tool" id="btn-download" href="../resources.html#library" aria-label="Download this book" download>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
    </a>
  </div>
</header>

<main id="stage" tabindex="-1">
  <div class="status" id="status" role="status">
    <div class="spinner" aria-hidden="true"></div>
    <p id="status-text">Opening the book</p>
  </div>
</main>

<footer class="bar bar-bottom">
  <button class="turn" id="btn-prev" type="button" aria-label="Previous page" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="where">
    <input type="range" id="progress" min="0" max="1" step="any" value="0" aria-label="Where you are in the book" disabled>
    <p id="where-text"></p>
  </div>
  <button class="turn" id="btn-next" type="button" aria-label="Next page" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</footer>

<div class="scrim" id="scrim" hidden></div>

<aside class="panel panel-left" id="toc-panel" aria-label="Contents" hidden>
  <div class="panel-head">
    <p class="panel-title">Contents</p>
    <button class="tool" type="button" data-close aria-label="Close contents">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <input class="field" id="toc-filter" type="search" placeholder="Find a chapter" aria-label="Find a chapter in the contents">
  <nav id="toc" class="toc"></nav>
</aside>

<aside class="panel panel-left" id="search-panel" aria-label="Search in this book" hidden>
  <div class="panel-head">
    <p class="panel-title">Search this book</p>
    <button class="tool" type="button" data-close aria-label="Close search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <form id="search-form" class="search-form" role="search">
    <input class="field" id="search-input" type="search" placeholder="A word or phrase" aria-label="Word or phrase to find">
    <button class="pill" type="submit">Find</button>
  </form>
  <p class="search-note" id="search-note"></p>
  <ol class="search-results" id="search-results"></ol>
</aside>

<aside class="panel panel-right" id="settings-panel" aria-label="Reading settings" hidden>
  <div class="panel-head">
    <p class="panel-title">Reading settings</p>
    <button class="tool" type="button" data-close aria-label="Close settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="setting">
    <p class="setting-name">Text size</p>
    <div class="pills">
      <button class="pill" type="button" id="size-down" aria-label="Smaller text">A&minus;</button>
      <span class="size-value" id="size-value">100%</span>
      <button class="pill" type="button" id="size-up" aria-label="Larger text">A+</button>
    </div>
  </div>
  <div class="setting">
    <p class="setting-name">Page color</p>
    <div class="pills" role="radiogroup" aria-label="Page color">
      <button class="pill" type="button" role="radio" data-theme-choice="light" aria-checked="false">Light</button>
      <button class="pill" type="button" role="radio" data-theme-choice="sepia" aria-checked="false">Sepia</button>
      <button class="pill" type="button" role="radio" data-theme-choice="dark" aria-checked="false">Dark</button>
    </div>
  </div>
  <div class="setting">
    <p class="setting-name">Turning pages</p>
    <div class="pills" role="radiogroup" aria-label="Turning pages">
      <button class="pill" type="button" role="radio" data-flow-choice="paginated" aria-checked="false">Pages</button>
      <button class="pill" type="button" role="radio" data-flow-choice="scrolled" aria-checked="false">Scroll</button>
    </div>
  </div>
  <div class="setting">
    <p class="setting-name">Notes</p>
    <div class="pills" role="radiogroup" aria-label="Notes">
      <button class="pill" type="button" role="radio" data-notes-choice="popup" aria-checked="false">Tap to open</button>
      <button class="pill" type="button" role="radio" data-notes-choice="inline" aria-checked="false">In the text</button>
    </div>
    <p class="setting-help">In the study Bibles and many older books, a small letter in the text opens the note that goes with it.</p>
  </div>
</aside>

<dialog class="note" id="note-dialog" aria-label="Note">
  <div class="note-body" id="note-body"></div>
  <form method="dialog" class="note-foot"><button class="pill" type="submit">Close</button></form>
</dialog>
</body>
</html>
