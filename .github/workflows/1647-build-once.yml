name: Build 1647 review branch
on:
  push:
    branches: [1647-confessional-alignment-2026-10]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate the site
        run: python3 build.py
      - name: Validate all pages and Bible Helps
        run: |
          python3 check.py
          python3 check_biblehelps.py
          node --check biblehelps/assets/companion.js
      - name: Commit generated pages
        run: |
          git add -u -- '*.html' sitemap.xml robots.txt llms.txt CNAME favicon.ico content/dates.json assets/search-index.json
          if git diff --cached --quiet; then
            echo "Pages are up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate 1647 Westminster aligned pages"
            git push origin HEAD:refs/heads/1647-confessional-alignment-2026-10
          fi
