name: Rebuild and validate sitewide revision
on:
  push:
    branches:
      - sitewide-1647-content-links-audit-2026-10
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild all public pages
        run: python3 build.py
      - name: Validate HTML, Gospel, Bible assets, references, and Javascript
        run: |
          python3 check.py
          python3 check_biblehelps.py
          python3 audit_site.py
          node --check biblehelps/assets/companion.js
      - name: Commit generated public pages
        run: |
          git add -u -- '*.html' sitemap.xml robots.txt llms.txt CNAME favicon.ico content/dates.json assets/search-index.json
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "All pages are current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate and validate complete sitewide citation and doctrine update"
            git push origin HEAD:refs/heads/sitewide-1647-content-links-audit-2026-10
          fi
