name: Rebuild assurance pages on review branch
on:
  push:
    branches:
      - assurance-pastoral-revision-2026-10
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build generated pages
        run: python3 build.py
      - name: Validate generated site
        run: |
          python3 check.py
          node --check biblehelps/assets/companion.js
      - name: Commit regenerated site to review branch
        run: |
          git add -u -- '*.html' sitemap.xml robots.txt llms.txt CNAME favicon.ico content/dates.json assets/search-index.json
          if git diff --cached --quiet; then
            echo "Site already generated."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build assurance pages for publication"
            git push origin HEAD:refs/heads/assurance-pastoral-revision-2026-10
          fi
