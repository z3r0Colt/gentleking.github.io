# Builds the site and publishes it to GitHub Pages on every push to main.
#
# ONE TIME SETUP. In this repository open Settings, then Pages, and set
# Source to "GitHub Actions". That is the only thing that has to be done by
# hand. A workflow is not allowed to switch Pages on for a repository, so
# until that dropdown is set this will fail at the publish step.
#
# After that, every push to main publishes. The build script runs here rather
# than trusting the .html files already committed, so what goes live always
# matches what is in content/. The checker runs right after it, and a page
# with broken HTML or a dead link fails the job instead of reaching readers.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it partway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the pages
        run: python3 build.py

      - name: Check the pages
        run: python3 check.py

      - name: Warn if the committed pages are out of date
        run: |
          if ! git diff --quiet -- '*.html' sitemap.xml robots.txt; then
            echo "::warning::The .html files committed to the repo do not match a fresh build."
            echo "::warning::The live site is fine, it is built here. But run python3 build.py and commit."
            git diff --stat -- '*.html' sitemap.xml robots.txt
          else
            echo "Committed pages match a fresh build."
          fi

      - name: Gather what gets published
        run: |
          mkdir -p _site
          cp -- *.html robots.txt sitemap.xml _site/
          cp -r assets _site/
          touch _site/.nojekyll
          echo "Publishing:"
          find _site -type f | sort | sed 's/^/  /'

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
