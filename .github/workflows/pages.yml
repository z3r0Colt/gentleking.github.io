# Builds the site and publishes it to GitHub Pages on every push to main.
#
# The build script runs here rather than trusting the .html files in the repo,
# so what goes live always matches what is in content/. The checker runs right
# after, and a page with broken HTML or a dead link fails the job instead of
# going out.
#
# The configure step turns Pages on by itself the first time this runs, so
# there is nothing to click in the repository settings.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it partway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the pages
        run: python3 build.py

      - name: Check the pages
        run: python3 check.py

      - name: Gather what gets published
        run: |
          mkdir -p _site
          cp -- *.html robots.txt sitemap.xml _site/
          cp -r assets _site/
          touch _site/.nojekyll
          echo "Publishing:"
          find _site -type f | sort | sed 's/^/  /'

      - name: Turn on Pages if it is not on yet
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
