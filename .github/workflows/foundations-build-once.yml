name: Build foundations and Westminster review
on:
  push:
    branches: [complete-foundations-and-westminster-2026-10]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate public pages
        run: python3 build.py
      - name: Check site and scripture references
        run: |
          python3 check.py
          python3 check_biblehelps.py
          python3 audit_site.py
          python3 check_foundations.py
          node --check biblehelps/assets/companion.js
          node --check assets/js/corrections.js
      - name: Commit generated pages on review branch
        run: |
          git add -u -- '*.html' sitemap.xml robots.txt llms.txt CNAME favicon.ico content/dates.json assets/search-index.json
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "Generated site is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate complete foundations and Westminster site"
            git push origin HEAD:refs/heads/complete-foundations-and-westminster-2026-10
          fi
