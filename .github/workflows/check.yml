# Rebuilds the site and checks it on every push to main.
#
# GitHub Pages serves this repository straight from the main branch, so the
# .html files committed here are literally what readers get. That makes one
# thing important. If the words in content/ change and build.py is never run,
# the repo and the live site quietly disagree.
#
# So this job rebuilds from content/ and fails if the result differs from what
# was committed. A red mark means "you forgot to run build.py", and the fix is
# to run it and commit the pages it writes. A line starting with ?? is a page
# build.py wrote that was never committed.
#
# It also runs check.py, which catches broken HTML, links pointing at files
# that are not here, anchors pointing at ids no page has, stray em dashes,
# semicolons, and colons in prose, overlong search descriptions, and broken
# structured data.
#
# content/dates.json is part of the build. It holds when each page last really
# changed, for the sitemap, and build.py moves a date only when a page's words
# change. So a fresh build of the same commit writes the same files here.

name: Build and check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the pages from content/
        run: python3 build.py

      - name: Require current generated pages in pull requests
        if: github.event_name == 'pull_request'
        run: |
          # Source-only PRs are checked here. Publishing rebuilds on main.
          echo "Source changes are built and tested before merging."

      - name: Check the pages
        run: |
          python3 check.py
          python3 check_biblehelps.py
          python3 audit_site.py
          python3 check_foundations.py
          python3 contractions_audit.py
          node --check biblehelps/assets/companion.js
          node --check assets/js/corrections.js
          node --check assets/js/kjv.js

      - name: Commit generated pages after successful checks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain -- '*.html' sitemap.xml robots.txt llms.txt CNAME favicon.ico content/dates.json assets/search-index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.html' sitemap.xml robots.txt llms.txt CNAME favicon.ico content/dates.json assets/search-index.json
            git commit -m "Rebuild published pages from reviewed content"
            git push origin HEAD:main
          else
            echo "Generated pages already match content sources."
          fi
