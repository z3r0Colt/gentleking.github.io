  <p><strong>In danger, or thinking of ending your life?</strong> Call <a href="tel:911">911</a>, or call <a href="tel:988">988</a> or <a href="sms:988">text 988</a>, now. If someone at home is hurting you, read <a href="comfort-safety.html">If You Are Not Safe</a>. Outside the United States, call your local emergency number.</p>
