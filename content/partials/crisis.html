<div class="callout callout-crisis">
  <p><strong>In immediate danger?</strong> Call <a href="tel:911">911</a> in the United States. For thoughts of suicide or emotional distress, call <a href="tel:988">988</a> or <a href="sms:988">text 988</a>. Tell someone safe near you if you may harm yourself. If someone at home is hurting you, read <a href="comfort-safety.html">If You Are Not Safe</a>. Outside the United States, call your local emergency number.</p>
</div>
